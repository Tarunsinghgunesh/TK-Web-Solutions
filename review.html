<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a Review | TK Web Solutions</title>

<style>
body{
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f172a,#020617);
color:#fff;
margin:0;
padding:20px;
display:flex;
justify-content:center;
}

.container{
max-width:420px;
width:100%;
background:#111827;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

/* Founder */
.founder-img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;
border:3px solid #ffd700;
}

.logo{
font-size:20px;
font-weight:800;
}

.founder{
font-size:13px;
color:#9ca3af;
margin-bottom:15px;
}

/* Text */
h1{font-size:22px;}
p{color:#9ca3af;font-size:14px;}

/* Button */
.btn{
display:inline-block;
margin-top:15px;
background:linear-gradient(135deg,#ffd700,#f59e0b);
color:#000;
padding:14px 28px;
border-radius:12px;
font-weight:700;
text-decoration:none;
}

/* QR */
.qr{
margin-top:20px;
background:#fff;
padding:10px;
border-radius:12px;
display:inline-block;
}

/* Testimonials */
.testimonial{
margin-top:25px;
text-align:left;
background:#020617;
padding:15px;
border-radius:12px;
border:1px solid #1f2937;
}

.testimonial p{
font-size:13px;
color:#d1d5db;
margin-bottom:5px;
}

.testimonial span{
font-size:11px;
color:#9ca3af;
}

</style>
</head>

<body>

<div class="container">

<!-- Founder -->
<img src="founder.jpg" class="founder-img">
<div class="logo">TK Web Solutions</div>
<div class="founder">Founded by Tarun Singh</div>

<h1>⭐ Share Your Experience</h1>
<p>Your feedback helps us grow and serve better.</p>

<a href="https://g.page/r/CcyzR1ERbtXcEBM/review" target="_blank" class="btn">
Leave a Review
</a>

<!-- QR -->
<div class="qr">
<img src="review-qr.jpg" width="120">
</div>

<p style="font-size:12px;">Scan QR for quick review</p>

<!-- Testimonials -->
<div class="testimonial">
<p>“Amazing website service, very professional work.”</p>
<span>— Client</span>
</div>

<div class="testimonial">
<p>“Fast delivery and great support. Highly recommended.”</p>
<span>— Client</span>
</div>

</div>

</body>
</html>
