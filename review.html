<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a Review | TK Web Solutions</title>

<style>
body{
font-family:'Poppins',sans-serif;
background:radial-gradient(circle at top,#0f172a,#020617);
color:#fff;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* Container */
.container{
background:linear-gradient(145deg,#0b1220,#020617);
padding:40px 28px;
border-radius:24px;
max-width:430px;
width:100%;
text-align:center;
box-shadow:0 30px 80px rgba(0,0,0,0.8);
}

/* Founder */
.founder-img{
width:95px;
height:95px;
border-radius:50%;
object-fit:cover;
border:3px solid #ffd700;
box-shadow:0 0 25px rgba(255,215,0,0.6);
margin-bottom:10px;
}

/* Text */
.logo{
font-size:24px;
font-weight:800;
}

.founder{
font-size:13px;
color:#9ca3af;
margin-bottom:18px;
}

h1{
font-size:22px;
margin-bottom:10px;
}

p{
color:#9ca3af;
font-size:14px;
margin-bottom:20px;
}

/* Button */
.btn{
display:inline-block;
background:linear-gradient(135deg,#ffd700,#f59e0b);
color:#000;
padding:15px 30px;
border-radius:14px;
font-weight:800;
text-decoration:none;
box-shadow:0 15px 40px rgba(245,158,11,0.5);
transition:all .3s;
}

.btn:hover{
transform:translateY(-4px) scale(1.05);
box-shadow:0 20px 60px rgba(245,158,11,0.8);
}

/* QR */
.qr{
margin-top:20px;
}

.qr img{
width:120px;
background:#fff;
padding:10px;
border-radius:12px;
}

/* Offer box */
.offer{
margin-top:20px;
background:rgba(255,215,0,0.08);
border:1px solid rgba(255,215,0,0.3);
padding:14px;
border-radius:12px;
font-size:13px;
color:#facc15;
}

/* WhatsApp button */
.wa-btn{
display:inline-block;
margin-top:15px;
background:#25d366;
color:#fff;
padding:12px 22px;
border-radius:10px;
text-decoration:none;
font-weight:700;
}

.small{
font-size:12px;
color:#6b7280;
margin-top:12px;
}

</style>
</head>

<body>

<div class="container">

<img src="founder.jpg" class="founder-img">

<div class="logo">TK Web Solutions</div>
<div class="founder">Founded by Tarun Singh</div>

<h1>⭐ Share Your Experience</h1>

<p>Your feedback helps us grow and serve you better.</p>

<!-- Review Button -->
<a href="https://g.page/r/CcyzR1ERbtXcEBM/review" target="_blank" class="btn">
Leave a Review
</a>

<!-- QR -->
<div class="qr">
<img src="review-qr.jpg">
</div>

<p class="small">Scan QR for quick review</p>

<!-- Offer -->
<div class="offer">
🎁 Get <b>10% OFF</b> on your next project  
Just send your review screenshot on WhatsApp
</div>

<!-- WhatsApp -->
<a href="https://wa.me/919079368240?text=Hi%20Tarun%20bhai,%20maine%20review%20de%20diya%20hai%20😊" target="_blank" class="wa-btn">
Send Screenshot on WhatsApp
</a>

<p class="small">We appreciate your support ❤️</p>

</div>

</body>
</html>
