<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a Review | TK Web Solutions</title>

<style>
body{
font-family:'Segoe UI', sans-serif;
background:linear-gradient(135deg,#020617,#0f172a);
color:#fff;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:#0b1220;
padding:35px 25px;
border-radius:20px;
width:100%;
max-width:420px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

/* Founder */
.founder-img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:3px solid #facc15;
margin-bottom:12px;
}

.logo{
font-size:22px;
font-weight:800;
}

.founder{
font-size:13px;
color:#9ca3af;
margin-bottom:20px;
}

/* Heading */
h1{
font-size:22px;
margin-bottom:10px;
}

p{
color:#9ca3af;
font-size:14px;
margin-bottom:25px;
}

/* ACTION ROW */
.action-row{
display:flex;
align-items:center;
justify-content:center;
gap:20px;
margin-top:10px;
flex-wrap:wrap;
}

/* Button */
.btn{
background:linear-gradient(135deg,#ffd700,#f59e0b);
color:#000;
padding:14px 26px;
border-radius:12px;
font-weight:700;
text-decoration:none;
box-shadow:0 10px 30px rgba(245,158,11,0.4);
transition:all .3s;
}

.btn:hover{
transform:translateY(-3px) scale(1.05);
box-shadow:0 15px 45px rgba(245,158,11,0.6);
}

/* QR */
.qr-box{
background:#fff;
padding:10px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.qr-box img{
width:110px;
display:block;
}

.small{
font-size:12px;
color:#6b7280;
margin-top:15px;
}

</style>
</head>

<body>

<div class="container">

<img src="founder.jpg" class="founder-img">

<div class="logo">TK Web Solutions</div>
<div class="founder">Founded by Tarun Singh</div>

<h1>⭐ Share Your Experience</h1>

<p>Your feedback helps us grow and deliver better services.</p>

<div class="action-row">

<a href="https://g.page/r/CcyzR1ERbtXcEBM/review" target="_blank" class="btn">
Leave a Review
</a>

<div class="qr-box">
<img src="review-qr.jpg">
</div>

</div>

<p class="small">Scan QR for quick review</p>

</div>

</body>
</html>
